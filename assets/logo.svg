<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B4E"/>
      <stop offset="50%" stop-color="#1B1238"/>
      <stop offset="100%" stop-color="#120A24"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B794F6"/>
      <stop offset="50%" stop-color="#805AD5"/>
      <stop offset="100%" stop-color="#ED64A6"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEEBC8"/>
      <stop offset="50%" stop-color="#F6E05E"/>
      <stop offset="100%" stop-color="#ED8936"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with border -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#A78BFA" stroke-width="2.5" />
  
  <!-- Tiny background stars -->
  <circle cx="28" cy="35" r="1.5" fill="#E9D8FD" opacity="0.8"/>
  <circle cx="102" cy="40" r="1.2" fill="#E9D8FD" opacity="0.7"/>
  <circle cx="34" cy="95" r="1.2" fill="#E9D8FD" opacity="0.6"/>
  <circle cx="98" cy="88" r="1.5" fill="#E9D8FD" opacity="0.8"/>

  <!-- Cat ears silhouette -->
  <path d="M36 50 L44 26 Q49 24 55 38 Z" fill="url(#hairGrad)"/>
  <path d="M40 46 L46 32 Q49 31 52 40 Z" fill="#FBB6CE"/>
  <path d="M92 50 L84 26 Q79 24 73 38 Z" fill="url(#hairGrad)"/>
  <path d="M88 46 L82 32 Q79 31 76 40 Z" fill="#FBB6CE"/>

  <!-- Chibi head hair silhouette -->
  <circle cx="64" cy="62" r="30" fill="url(#hairGrad)" />
  <!-- Hair ahoge -->
  <path d="M64 34 Q68 20 60 18 Q54 22 62 33 Z" fill="url(#hairGrad)"/>

  <!-- Face -->
  <ellipse cx="64" cy="68" rx="22" ry="20" fill="#FFF5F5" />
  
  <!-- Bangs -->
  <path d="M42 56 Q52 70 56 56 Q64 72 68 56 Q76 70 86 56 Q84 46 64 46 Q44 46 42 56 Z" fill="url(#hairGrad)"/>

  <!-- Heterochromia eyes: right eye ruby, left eye gold -->
  <ellipse cx="54" cy="68" rx="4.5" ry="5.5" fill="#E53E3E"/>
  <circle cx="53" cy="66" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="74" cy="68" rx="4.5" ry="5.5" fill="#D69E2E"/>
  <circle cx="73" cy="66" r="1.5" fill="#FFFFFF"/>

  <!-- Cat mouth :3 -->
  <path d="M61 74 Q64 76 64 74 Q64 76 67 74" fill="none" stroke="#742A2A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Cute blushing cheeks -->
  <ellipse cx="48" cy="73" rx="3.5" ry="1.8" fill="#F687B3" opacity="0.8"/>
  <ellipse cx="80" cy="73" rx="3.5" ry="1.8" fill="#F687B3" opacity="0.8"/>

  <!-- Big Star Hair Accessory -->
  <g transform="translate(80, 42) rotate(15) scale(0.85)" filter="url(#glow)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#starGrad)"/>
  </g>
</svg>
